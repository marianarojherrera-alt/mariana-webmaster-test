<header class="site-header">

  <div class="header-container">

    <a
      class="brand"
      href="#inicio"
      (click)="closeMenu()"
    >
      Mariana Rojas
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="main-navigation"
      class="main-nav"
      [class.is-open]="menuOpen()"
      aria-label="Main navigation"
    >
      <a
        href="#inicio"
        (click)="closeMenu()"
      >
        Inicio
      </a>

      <a
        href="#expertise"
        (click)="closeMenu()"
      >
        Expertise
      </a>

      <a
        href="#contacto"
        (click)="closeMenu()"
      >
        Contacto
      </a>
    </nav>

  </div>

</header>
